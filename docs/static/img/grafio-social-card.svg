<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#4A90D9" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#7C3AED" opacity="0.05"/>
  
  <!-- Graph visualization area -->
  <g transform="translate(80, 120)">
    <!-- Edges -->
    <g stroke="#4A90D9" stroke-width="4" fill="none" opacity="0.7">
      <!-- Outer triangle edges -->
      <line x1="0" y1="350" x2="300" y2="0"/>
      <line x1="300" y1="0" x2="600" y2="350"/>
      <line x1="600" y1="350" x2="0" y2="350"/>
      
      <!-- Inner connecting lines -->
      <line x1="150" y1="175" x2="300" y2="175"/>
      <line x1="300" y1="175" x2="450" y2="175"/>
      <line x1="150" y1="175" x2="300" y2="350"/>
      <line x1="450" y1="175" x2="300" y2="350"/>
      
      <!-- Cross connections -->
      <line x1="0" y1="350" x2="300" y2="175" opacity="0.5"/>
      <line x1="600" y1="350" x2="300" y2="175" opacity="0.5"/>
    </g>
    
    <!-- Nodes -->
    <g fill="#4A90D9">
      <!-- Main triangle nodes -->
      <circle cx="0" cy="350" r="35"/>
      <circle cx="300" cy="0" r="40"/>
      <circle cx="600" cy="350" r="35"/>
      
      <!-- Center node -->
      <circle cx="300" cy="175" r="30"/>
      
      <!-- Inner triangle nodes -->
      <circle cx="150" cy="175" r="22" opacity="0.9"/>
      <circle cx="450" cy="175" r="22" opacity="0.9"/>
      <circle cx="300" cy="350" r="25" opacity="0.9"/>
    </g>
    
    <!-- Node labels -->
    <g fill="white" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
      <text x="0" y="355" font-size="14">A</text>
      <text x="300" y="8" font-size="16">B</text>
      <text x="600" y="355" font-size="14">C</text>
      <text x="300" y="180" font-size="12">X</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="900" y="260" fill="white" font-family="system-ui, sans-serif" font-size="72" font-weight="700" text-anchor="middle">
    Grafio
  </text>
  <text x="900" y="320" fill="#A855F7" font-family="system-ui, sans-serif" font-size="28" font-weight="400" text-anchor="middle">
    High Performance Graph Database
  </text>
  
  <!-- Tagline -->
  <text x="900" y="400" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
    Pluggable Storage • Cypher Queries
  </text>
  
  <!-- Bottom decoration -->
  <rect x="850" y="450" width="100" height="4" rx="2" fill="#4A90D9"/>
  <rect x="870" y="460" width="60" height="4" rx="2" fill="#7C3AED"/>
</svg>